<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Даниил & Дарья — Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #0b0b0d;
    color: #fff;
    overflow-x: hidden;
}

/* ===== PARALLAX HERO ===== */
.hero {
    height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero::before {
    content: "";
    position: absolute;
    top: -10%;
    left: 0;
    width: 100%;
    height: 120%;
    background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552');
    background-size: cover;
    background-position: center;
    transform: translateY(0);
    transition: transform 0.1s linear;
    filter: brightness(0.55);
}

.hero-content {
    position: relative;
    z-index: 2;
    animation: fadeIn 2s ease;
}

.hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 56px;
    letter-spacing: 1px;
}

.hero p {
    margin-top: 15px;
    opacity: 0.85;
}

/* ===== SECTIONS ===== */
.section {
    max-width: 900px;
    margin: auto;
    padding: 80px 20px;
}

.title {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    margin-bottom: 30px;
}

/* GLASS CARD */
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 25px;
    border-radius: 18px;
    margin-bottom: 20px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    background: rgba(255,255,255,0.07);
}

/* TIMER */
.timer {
    margin-top: 20px;
    font-size: 20px;
    opacity: 0.9;
}

/* MAP RESPONSIVE */
.map {
    position: relative;
    width: 100%;
    padding-top: 60%;
    border-radius: 16px;
    overflow: hidden;
    margin-top: 15px;
}

.map iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 0;
}

/* BUTTON */
.btn {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #d4af37, #f2d57e);
    color: #000;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.02);
}

/* ANIMATION */
.fade {
    opacity: 0;
    transform: translateY(40px);
    transition: 1s ease;
}

.fade.visible {
    opacity: 1;
    transform: translateY(0);
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* MOBILE */
@media (max-width: 600px) {
    .hero h1 {
        font-size: 36px;
    }
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <h1>Даниил & Дарья</h1>
        <p>Wedding Invitation</p>
        <div class="timer" id="timer"></div>

        <button class="btn" onclick="addWeddingToCalendar()">
            Добавить в календарь
        </button>
    </div>
</section>

<!-- EVENTS -->
<section class="section fade">
    <div class="title">Программа дня</div>

    <div class="card">
        <h3>18 июля 2026</h3>
        <p>10:40 — Роспись в ЗАГСе</p>
    </div>

    <div class="card">
        <h3>19 июля 2026</h3>
        <p>16:00 — Сбор гостей</p>
        <p>Банкет и вечерняя программа</p>
    </div>
</section>

<!-- LOCATIONS -->
<section class="section fade">
    <div class="title">Локации</div>

    <div class="card">
        <h3>ЗАГС</h3>
        <p>г. Липецк, ул. Ленина, 28</p>

        <div class="map">
            <iframe src="https://yandex.ru/map-widget/v1/?ll=39.607275%2C52.612325&z=18"></iframe>
        </div>
    </div>

    <div class="card">
        <h3>Банкет</h3>
        <p>Villa Park, Капитанщино</p>

        <div class="map">
            <iframe src="https://yandex.ru/map-widget/v1/?ll=39.820411%2C52.721743&z=14"></iframe>
        </div>
    </div>
</section>

<script>

/* ===== PARALLAX ===== */
window.addEventListener("scroll", () => {
    document.querySelector(".hero::before");
    const hero = document.querySelector(".hero::before");
});

/* ===== TIMER ===== */
const date = new Date("July 18, 2026 10:40:00").getTime();

setInterval(() => {
    const now = new Date().getTime();
    const diff = date - now;

    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    const m = Math.floor((diff % (1000*60*60)) / (1000*60));

    document.getElementById("timer").innerHTML =
        d + " дней " + h + " часов " + m + " минут";
}, 1000);

/* ===== CALENDAR ===== */
function addWeddingToCalendar() {

    const title = "Свадьба Даниил & Дарья 💍";
    const location = "Липецк / Villa Park";

    const start = "20260718T074000Z";
    const end   = "20260719T170000Z";

    const desc = "Программа свадебного дня: роспись, банкет, вечер";

    const url = "https://www.google.com/calendar/render?action=TEMPLATE"
        + "&text=" + encodeURIComponent(title)
        + "&dates=" + start + "/" + end
        + "&location=" + encodeURIComponent(location)
        + "&details=" + encodeURIComponent(desc);

    window.open(url, "_blank");
}

/* ===== SCROLL ANIMATION ===== */
const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
        if(e.isIntersecting) e.target.classList.add("visible");
    });
});

document.querySelectorAll(".fade").forEach(el => observer.observe(el));

</script>

</body>
</html>
